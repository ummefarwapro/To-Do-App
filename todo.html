<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="container">

    <h2>My To-Do List</h2>

    <input style="padding: 10px;" type="text" id="TodoInput" onkeydown="enter(event)">

    <button onclick="addSubmit()" class="green" id="ToDoSubmit">
        Add
    </button>

    <button onclick="deleteAll ()" class="delete" > 
        Delete
    </button>

    <ul id="TodoList">
        <li>Red</li>
        <li>Blue</li>
        <li>Yellow</li>
        <li>Green</li>
        <li>Gray</li>
    </ul>

</div>

    <script  src="todo.js"></script>
    <script type="module" src="todoTask-db.js"></script>
</body>
</html>
