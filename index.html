<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    
    <style>

 *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #7a8fee);

    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 380px;
    min-height: 350px;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.container h2 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
}


    .label {
    display: inline-block;
    margin-bottom: 7px;
    font-size: 15px;
    font-weight: bold;
    color: #444;
}

.input {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
}

.input:focus {
    border-color: #667eea;
    box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
}

button {
    text-decoration: none;
    width: 50%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: #667eea;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #5568d9;
    transform: translateY(-2px);
}

a {
    text-decoration: none;
    width: 48%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: #667eea;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

a:hover {
    background-color: #5568d9;
    transform: translateY(-2px);
}


.login {
    background-color: #764ba2;
}

.login:hover {
    background-color: #643c89;
}

    </style>

</head>
<body>


<div class="container">

<h2>Sign Up</h2>

<label for="" class="label" >Username</label> <br>
<input type="text" placeholder="Enter Your Username" class="input" id="userName"> <br>


<label for="" class="label" >Email</label> <br>
<input type="email" placeholder="Enter Your Email" class="input" id="email"> <br>

<label for="" class="label" >Password</label> <br>
<input type="password" placeholder="Enter Your Password" class="input" id="pswd"> <br>


<button type="button" class="submit" id="signUpBtn">Submit</button>

<a  href="login.html" class="login" >Login</a>

</div>

    <script src="app.js" type="module"></script>
</body>
</html>
